      - whatsapp
  /api/wa/conversations/{phone}/clear:
    post:
      description: Wipes message history while keeping the conversation row. Requires
        Admin role.
      parameters:
      - description: Phone number
        in: path
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              cleared:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Clear WhatsApp conversation
      tags:
      - whatsapp
  /api/wa/conversations/{phone}/messages:
    get:
      description: Returns chat messages for a phone number's WhatsApp conversation.
        Requires Admin role.
      parameters:
      - description: Phone number (with or without +)
        in: path
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.WAMessage'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get messages by phone
      tags:
      - whatsapp
  /api/wa/conversations/{phone}/mute:
    post:
      consumes:
      - application/json
      description: Suppresses or restores AI auto-reply for one thread. Requires Admin
        role.
      parameters:
      - description: Phone number
        in: path
        name: phone
        required: true
        type: string
      - description: Muted flag
        in: body
        name: body
        required: true
        schema:
          properties:
            muted:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              muted:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mute/unmute WhatsApp conversation
      tags:
      - whatsapp
  /api/wa/conversations/ensure:
    post:
      consumes:
      - application/json
      description: Idempotently creates a conversation row for the given phone. Requires
        Admin role.
      parameters:
      - description: Phone and provider
        in: body
        name: body
        required: true
        schema:
          properties:
            phone:
              type: string
            provider:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              conversation_id:
                format: int64
                type: integer
              phone:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ensure WhatsApp conversation
      tags:
      - whatsapp
  /api/wa/meta/app-config:
    get:
      description: Returns public Meta app config (app_id, es_config_id) needed by
        the frontend for Embedded Signup.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              app_id:
                type: string
              es_config_id:
                type: string
              graph_version:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Meta app config
      tags:
      - whatsapp
  /api/wa/onboard/exchange:
    post:
      consumes:
      - application/json
      description: Exchanges an Embedded Signup code for a long-lived access token,
        fetches the phone number ID, and stores both per-org. Requires Admin role.
      parameters:
      - description: OAuth code
        in: body
        name: body
        required: true
        schema:
          properties:
            code:
              type: string
            phone_number_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              phone_display:
                type: string
              phone_number_id:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Meta Embedded Signup exchange
      tags:
      - whatsapp
  /api/wa/send:
    post:
      consumes:
      - application/json
      description: Sends a manual outbound WhatsApp message. Accepts to_phone/message
        or contact_phone/text. Requires Admin role.
      parameters:
      - description: Message details
        in: body
        name: body
        required: true
        schema:
          properties:
            channel_id:
              format: int64
              type: integer
            message:
              type: string
            to_phone:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              conversation_id:
                format: int64
                type: integer
              phone:
                type: string
              sent:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send WhatsApp message
      tags:
      - whatsapp
  /api/wa/session:
    get:
      description: Returns WaSender session list for the org's Personal Access Token.
        Requires Admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List WaSender sessions
      tags:
      - whatsapp
  /api/wa/session/{id}/connect:
    post:
      description: Initiates connection and returns the initial QR code for scanning.
        Requires Admin role.
      parameters:
      - description: WaSender session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Connect WaSender session
      tags:
      - whatsapp
  /api/wa/session/{id}/disconnect:
    post:
      description: Drops the WhatsApp link and resets session to NEED_SCAN state.
        Requires Admin role.
      parameters:
      - description: WaSender session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disconnect WaSender session
      tags:
      - whatsapp
  /api/wa/session/{id}/qr:
    get:
      description: Fetches a fresh QR code for an initialized session (used for 40s
        auto-refresh). Requires Admin role.
      parameters:
      - description: WaSender session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get WaSender session QR
      tags:
      - whatsapp
  /api/wa/toggle-ai/{phone}:
    post:
      consumes:
      - application/json
      description: Enables or disables AI auto-reply for a specific WhatsApp conversation.
        Requires Admin role.
      parameters:
      - description: Phone number
        in: path
        name: phone
        required: true
        type: string
      - description: AI enabled flag
        in: body
        name: body
        required: true
        schema:
          properties:
            enabled:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              ai_enabled:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Toggle AI by phone
      tags:
      - whatsapp
  /api/webhooks:
    get:
      description: Returns all configured outbound webhooks for the org. Requires
        Admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List webhooks
      tags:
      - webhooks
    post:
      consumes:
      - application/json
      description: Registers a new outbound webhook endpoint. Requires Admin role.
      parameters:
      - description: Webhook config
        in: body
        name: body
        required: true
        schema:
          properties:
            event:
              type: string
            secret_key:
              type: string
            url:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.IDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create webhook
      tags:
      - webhooks
  /api/webhooks/{id}:
    delete:
      description: Removes an outbound webhook. Requires Admin role.
      parameters:
      - description: Webhook ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeletedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete webhook
      tags:
      - webhooks
  /api/webhooks/{id}/logs:
    get:
      description: Returns the last 50 delivery attempts for a webhook. Requires Admin
        role.
      parameters:
      - description: Webhook ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get webhook logs
      tags:
      - webhooks
  /crm-webhook:
    get:
      description: Receives CRM push notifications (new lead events) or responds to
        hub challenge verification.
      parameters:
      - description: HubSpot challenge string
        in: query
        name: hub.challenge
        type: string
      responses:
        "200":
          description: OK or challenge echo
      summary: CRM push webhook
      tags:
      - webhooks
  /exotel/recording-ready:
    get:
      description: Called by Exotel when a call recording is available for download.
      responses:
        "200":
          description: OK
      summary: Exotel recording ready hook
      tags:
      - webhooks
  /wa/webhook/aisensei:
    post:
      consumes:
      - application/json
      description: Receives inbound WhatsApp messages from AiSensei. Called by the
        AiSensei platform.
      responses:
        "200":
          description: OK
      summary: AiSensei inbound webhook
      tags:
      - webhooks
  /wa/webhook/gupshup:
    post:
      consumes:
      - application/json
      description: Receives inbound WhatsApp messages from Gupshup. Called by the
        Gupshup platform.
      responses:
        "200":
          description: OK
      summary: Gupshup inbound webhook
      tags:
      - webhooks
  /wa/webhook/interakt:
    post:
      consumes:
      - application/json
      description: Receives inbound WhatsApp messages from Interakt. Called by the
        Interakt platform.
      responses:
        "200":
          description: OK
      summary: Interakt inbound webhook
      tags:
      - webhooks
  /wa/webhook/meta:
    post:
      consumes:
      - application/json
      description: Receives inbound messages from Meta Cloud API (POST) or hub challenge
        verification (GET).
      parameters:
      - description: Challenge verification mode
        in: query
        name: hub.mode
        type: string
      - description: Verification token
        in: query
        name: hub.verify_token
        type: string
      - description: Challenge string
        in: query
        name: hub.challenge
        type: string
      responses:
        "200":
          description: OK or challenge echo
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Meta WhatsApp webhook
      tags:
      - webhooks
  /wa/webhook/wasender:
    post:
      consumes:
      - application/json
      description: Receives inbound WhatsApp messages from WaSender (X-Webhook-Signature
        verified). Called by WaSender.
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: WaSender inbound webhook
      tags:
      - webhooks
  /wa/webhook/wati:
    post:
      consumes:
      - application/json
      description: Receives inbound WhatsApp messages from Wati. Called by the Wati
        platform.
      responses:
        "200":
          description: OK
      summary: Wati inbound webhook
      tags:
      - webhooks
  /webhook/exotel:
    get:
      description: Returns ExoML connecting the call to the media-stream WebSocket.
        Called by Exotel's Passthru applet.
      parameters:
      - description: Exotel call SID
        in: query
        name: CallSid
        type: string
      - description: Caller phone number
        in: query
        name: CallFrom
        type: string
      produces:
      - application/xml
      responses:
        "200":
          description: ExoML response
          schema:
            type: string
      summary: Exotel ExoML hook
      tags:
      - webhooks
  /webhook/exotel/human-call:
    get:
      description: Returns ExoML that announces the customer and bridges the agent
        to them. Called by Exotel when the agent answers.
      parameters:
      - description: Customer phone number
        in: query
        name: customer_phone
        required: true
        type: string
      - description: Customer display name
        in: query
        name: customer_name
        type: string
      produces:
      - application/xml
      responses:
        "200":
          description: ExoML response
          schema:
            type: string
      summary: Human call ExoML hook
      tags:
      - webhooks
  /webhook/exotel/status:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Receives call status updates from Exotel (completed, failed, no-answer,
        etc.).
      responses:
        "200":
          description: OK
      summary: Exotel call status hook
      tags:
      - webhooks
  /webhook/twilio:
    get:
      description: Returns TwiML connecting the call to the media-stream WebSocket.
        Called by Twilio.
      parameters:
      - description: Lead ID
        format: int64
        in: query
        name: lead_id
        type: integer
      - description: Campaign ID
        format: int64
        in: query
        name: campaign_id
        type: integer
      - description: Org ID
        format: int64
        in: query
        name: org_id
        type: integer
      produces:
      - text/xml
      responses:
        "200":
          description: TwiML response
          schema:
            type: string
      summary: Twilio TwiML hook
      tags:
      - webhooks
  /webhook/twilio/status:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Receives call status updates from Twilio (initiated, ringing, completed,
        failed, etc.).
      responses:
        "200":
          description: OK
      summary: Twilio call status hook
      tags:
      - webhooks
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter: **Bearer {JWT token}**. Obtain a token from POST /api/auth/login
      or POST /api/auth/signup.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
