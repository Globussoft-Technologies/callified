host: localhost:8011
info:
  contact:
    email: support@callified.ai
    name: Callified Support
  description: AI-powered outbound calling, WhatsApp CRM & receptionist platform.
  termsOfService: http://callified.ai/terms
  title: Callified Backend API
  version: "1.0"
paths:
  /api/active-calls:
    get:
      description: Returns all currently active call sessions with stream SIDs and
        monitor URLs. Requires Admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              active_calls:
                type: array
              count:
                type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List active calls
      tags:
      - calls
  /api/admin/feature-flags:
    post:
      consumes:
      - application/json
      description: Super-admin endpoint to enable/disable feature flags for an email.
      parameters:
      - description: Feature flag payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.UserFeatureFlagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserFeatureFlagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Set user feature flag
      tags:
      - admin
  /api/admin/feature-flags/{email}:
    delete:
      description: Super-admin endpoint to remove feature flags for an email.
      parameters:
      - description: Email address
        in: path
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete user feature flag
      tags:
      - admin
    get:
      description: Super-admin endpoint to fetch feature flags for an email.
      parameters:
      - description: Email address
        in: path
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserFeatureFlagResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
