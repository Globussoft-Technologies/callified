sonar.projectKey=callified-main
sonar.projectName=Callified Main
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9002
# Set SONAR_TOKEN as an environment variable; do not commit the token.
# Example: export SONAR_TOKEN=squ_... && sonar-scanner

sonar.sources=backend,frontend/src,tests,website,scripts,mobile-app,native-android/app,native-ios/DialerApp
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.pb.go,**/docs/**,**/examples/**,**/_archive/**,**/bin/**,**/__pycache__/**,**/*.min.js,**/*.min.css,**/Pods/**,**/.gradle/**,**/android/build/**,**/*.xcworkspace/**

# Go specific
sonar.go.coverage.reportPaths=backend/coverage.out

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
